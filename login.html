<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .login{
    
            height: 300px;
            width: 200px;
            background-color: silver;
            border-radius: 10px;
            
        }
        .div-child{
            padding: 10px;
        }
        input{
            padding: 5px;
            margin: 5px;
            border: 0px;
            border-radius: 10px;
            width: auto;
            height: 25px;
        }
        .logo{
            display: flex;
            justify-content: center;
        }
        img{
            background: rgb(250, 250, 250);
            border-radius: 10px;
            padding: 10px;
            margin: 5px;
            height: 25px;
            width: 25px;
        }
        
    </style>
</head>
<body>
    <div class="login">
        <div class="div-child"><h1>Login page</h1></div>
        <div class="div-child">
            <p>Email</p>
            <input type="text" placeholder="Email">
        </div>
        <div class="div-child">
            <p>Passward</p>
            <input type="password" placeholder="Passward">
        </div>
        <div class="logo">
            <a><img src="google.png"></a>
            <a><img src="apple.png"></a>
        </div>
    </div>
</body>
</html>
